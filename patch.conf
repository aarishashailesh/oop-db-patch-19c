#!/usr/bin/env bash
# =============================================================================
# patch.conf — Central Patch Configuration
# Oracle OOP Patching — Single Node CRS (lnx98)
#
# EDIT THIS FILE FOR EACH PATCH CYCLE.
# All scripts source this file — no hardcoded values anywhere else.
# =============================================================================

# -----------------------------------------------------------------------------
# PATCH IDENTITY — update for each patch cycle
# -----------------------------------------------------------------------------

# Target and current patch level labels (used in log messages)
NEW_PATCH_LEVEL="19.32"
OLD_PATCH_LEVEL="19.31"

# RU Combo patch number (outer zip, e.g. p39618711_190000_Linux-x86-64.zip)
RU_COMBO_PATCH="39618711"

# GI RU bundle directory inside RU combo (contains bundle.xml)
GI_RU_PATCH="39467003"

# gridSetup.sh -applyRU: OCW sub-patch directory inside GI_RU_PATCH
GI_APPLY_RU_PATCH="39526364"

# gridSetup.sh -applyOneOffs: comma-separated sub-patch IDs (Grid home only)
GI_ONEOFF_PATCHES="39107825,39107855,39472050,39503034"

# runInstaller -applyRU: DB RU sub-patch directory inside GI_RU_PATCH
DB_APPLY_RU_PATCH="39472050"

# runInstaller -applyOneOffs: comma-separated sub-patch IDs (DB home only)
DB_ONEOFF_PATCHES="39526364"

# DB-specific standalone patches (outside the RU combo)
DB_RU_STANDALONE_PATCH="39657094"
DB_RU_STANDALONE_ZIP="p39657094_1932000DBRU_Generic.zip"

# Patches that live at the TOP LEVEL of the RU combo (not inside GI_RU_PATCH bundle dir)
# These are referenced as ${RU_PATCH_DIR}/<patch_id> — comma-separated IDs
# Example: OJVM patch 39222882 lives at 39618711/39222882/ not 39618711/39467003/39222882/
RU_COMBO_TOPLEVEL_PATCHES="39222882"

# OPatch patch number (update only when OPatch itself has a new version)
OPATCH_PATCH="6880880"

# -----------------------------------------------------------------------------
# HOME PATHS — explicit full paths, not derived from patch level
# Grid and DB homes follow different naming conventions and base directories.
# Update BOTH old and new paths for each patch cycle.
# -----------------------------------------------------------------------------

# Current active Grid home (running)
OLD_GRID_HOME="/u01/app/19.0.0/grid"

# New patched Grid home (to be built)
NEW_GRID_HOME="/u01/app/19.32.0.0/grid"

# Current active DB home (running)
# NOTE: DB home path format is independent of Grid home path format.
#       lnx98 uses /u01/app/oracle/product/19.0.0/dbhome_1 (not version-stamped)
#       lnx103 uses /u01/app/odaorahome/oracle/product/19.0.0.0/dbhome_1931
OLD_DB_HOME="/u01/app/oracle/product/19.0.0/dbhome_1"

# New patched DB home (to be built)
NEW_DB_HOME="/u01/app/oracle/product/19.0.0/dbhome_1932"

# -----------------------------------------------------------------------------
# RESPONSE FILES — paths to existing response files used for software install
# These are updated in-place (ORACLE_HOME line patched) before each install.
# -----------------------------------------------------------------------------

# Grid Infrastructure response file (used with gridSetup.sh CRS_SWONLY)
GRID_RSP="/u01/rsp/grid_install.rsp"

# Oracle Database response file (used with runInstaller INSTALL_DB_SWONLY)
DB_RSP="/u01/rsp/db_install.rsp"

# -----------------------------------------------------------------------------
# PATCH STAGING LAYOUT — update if staging location changes
# -----------------------------------------------------------------------------

# Root staging directory
PATCH_LOC="/u01/shared/software/patches/1932"

# Base 19.3 software zips
BASE_SW_DIR="/u01/shared/software/db/base_releases"

# Automation scripts directory — must be accessible by root, grid, and oracle users.
# /root is NOT accessible by grid/oracle — use a shared path under /u01 or PATCH_LOC.
SCRIPTS_DIR="/u01/shared/software/patches/automation"

# Log directory — written by root, grid, and oracle — must be world-writable or group-writable
LOG_DIR="/u01/shared/software/patches/1932/logs"

# Base software zip filenames
GRID_BASE_ZIP="LINUX.X64_193000_grid_home.zip"
DB_BASE_ZIP="LINUX.X64_193000_db_home.zip"

# OPatch and RU combo zip filenames (derived from patch numbers above)
OPATCH_ZIP="p${OPATCH_PATCH}_190000_Linux-x86-64.zip"
RU_COMBO_ZIP="p${RU_COMBO_PATCH}_190000_Linux-x86-64.zip"

# AutoUpgrade files
AUTOUPGRADE_CFG="${PATCH_LOC}/orcl_auto_patch.cfg"
AUTOUPGRADE_JAR="${PATCH_LOC}/autoupgrade.jar"

# -----------------------------------------------------------------------------
# DERIVED PATCH PATHS — computed from variables above. DO NOT edit these.
# -----------------------------------------------------------------------------

# RU combo extracts here
RU_PATCH_DIR="${PATCH_LOC}/${RU_COMBO_PATCH}"

# GI RU bundle directory (contains bundle.xml)
GI_RU_BUNDLE_DIR="${RU_PATCH_DIR}/${GI_RU_PATCH}"

# Full path for gridSetup.sh -applyRU
GI_APPLY_RU_PATH="${GI_RU_BUNDLE_DIR}/${GI_APPLY_RU_PATCH}"

# Full comma-separated paths for gridSetup.sh -applyOneOffs
GI_ONEOFF_PATHS=""
for _p in $(echo "${GI_ONEOFF_PATCHES}" | tr ',' ' '); do
  GI_ONEOFF_PATHS="${GI_ONEOFF_PATHS:+${GI_ONEOFF_PATHS},}${GI_RU_BUNDLE_DIR}/${_p}"
done
unset _p

# Full path for runInstaller -applyRU
DB_APPLY_RU_PATH="${GI_RU_BUNDLE_DIR}/${DB_APPLY_RU_PATCH}"

# Full comma-separated paths for runInstaller -applyOneOffs
# Three categories of patches can appear here:
#   1. Sub-patches inside GI_RU_PATCH bundle dir  → DB_ONEOFF_PATCHES
#   2. Top-level patches in RU combo (e.g. OJVM)  → RU_COMBO_TOPLEVEL_PATCHES
#   3. Standalone patches outside RU combo         → DB_RU_STANDALONE_PATCH
DB_ONEOFF_PATHS_FULL=""
for _p in $(echo "${DB_ONEOFF_PATCHES}" | tr ',' ' '); do
  DB_ONEOFF_PATHS_FULL="${DB_ONEOFF_PATHS_FULL:+${DB_ONEOFF_PATHS_FULL},}${GI_RU_BUNDLE_DIR}/${_p}"
done
unset _p
# Append top-level RU combo patches (live at RU_PATCH_DIR/<id>/ not inside bundle)
for _p in $(echo "${RU_COMBO_TOPLEVEL_PATCHES}" | tr ',' ' '); do
  [[ -n "${_p}" ]] && \
    DB_ONEOFF_PATHS_FULL="${DB_ONEOFF_PATHS_FULL:+${DB_ONEOFF_PATHS_FULL},}${RU_PATCH_DIR}/${_p}"
done
unset _p
# Append standalone DB patch
DB_ONEOFF_PATHS_FULL="${DB_ONEOFF_PATHS_FULL},${PATCH_LOC}/${DB_RU_STANDALONE_PATCH}"

# -----------------------------------------------------------------------------
# RUNTIME SETTINGS
# -----------------------------------------------------------------------------

export CV_ASSUME_DISTID="OEL7.8"

# OS users and groups
GRID_USER="grid"
ORACLE_USER="oracle"
INSTALL_GROUP="oinstall"

# Database name — leave empty to auto-detect via srvctl list database
# Set explicitly if auto-detection fails or you have multiple databases
DB_NAME="proddb"

# -----------------------------------------------------------------------------
# ORACLE BASE PATHS — required for AutoUpgrade ADR context and attachHome
# -----------------------------------------------------------------------------
ORACLE_BASE="/u01/app/oracle"
GRID_BASE="/u01/app/grid"

# -----------------------------------------------------------------------------
# ASM OS GROUPS — required for switchGridHome response file
# IMPORTANT: Verify these from the ORIGINAL grid_install.rsp before patching.
# Do NOT assume standard names — this environment uses 'asmbba' (not 'asmdba').
# Command to verify: grep -i "osdba\|osasm\|osoper" /u01/rsp/grid_install.rsp
# -----------------------------------------------------------------------------
GI_OSDBA_GROUP="asmbba"
GI_OSOPER_GROUP="asmoper"
GI_OSASM_GROUP="asmadmin"
